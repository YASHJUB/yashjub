<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يشجب - الصفحة غير موجودة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <style>
        .notfound-page {
            min-height: 100vh;
            background: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .notfound-num {
            font-size: 150px;
            font-weight: 900;
            color: #F5C518;
            line-height: 1;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
            opacity: 0.9;
        }

        .notfound-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .notfound-title {
            font-size: 28px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 12px;
            font-family: 'Cairo', sans-serif;
        }

        .notfound-sub {
            font-size: 15px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
            font-family: 'Cairo', sans-serif;
            line-height: 1.7;
            max-width: 400px;
        }

        .notfound-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .notfound-line {
            width: 60px;
            height: 3px;
            background: #F5C518;
            border-radius: 2px;
            margin: 0 auto 30px;
        }

        .btn-white {
            background: transparent;
            color: #FFFFFF;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-white:hover {
            border-color: #F5C518;
            color: #F5C518;
        }

        /* عداد تنازلي */
        .countdown-text {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-top: 30px;
            font-family: 'Cairo', sans-serif;
        }

        .countdown-text span {
            color: #F5C518;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="notfound-page">

        <!-- اللوقو -->
        <img src="images/logo.png" alt="يشجب" style="height:70px;margin-bottom:40px;opacity:0.8">

        <!-- الرقم 404 -->
        <div class="notfound-num">404</div>

        <div class="notfound-line"></div>

        <div class="notfound-icon">🔍</div>

        <div class="notfound-title">عذراً! الصفحة غير موجودة</div>

        <div class="notfound-sub">
            الصفحة التي تبحث عنها غير موجودة أو تم نقلها أو حذفها.<br>
            تأكد من الرابط أو ارجع للصفحة الرئيسية.
        </div>

        <div class="notfound-btns">
            <button class="btn" onclick="window.location.href='index.html'">
                🏠 الصفحة الرئيسية
            </button>
            <button class="btn-white" onclick="window.history.back()">
                → رجوع
            </button>
        </div>

        <div class="countdown-text">
            سيتم تحويلك تلقائياً خلال <span id="countdown">10</span> ثواني
        </div>

    </div>

    <script>
        // عداد تنازلي
        let seconds = 10;
        const timer = setInterval(() => {
            seconds--;
            document.getElementById('countdown').textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>

</body>
</html>
