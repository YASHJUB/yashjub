<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يشجب - اختر المنتج</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest"></head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-right">
            <img src="images/logo.png" alt="يشجب" class="logo-img">
            <div class="tagline">منصة خدمات البناء والبنية التحتية</div>
        </div>
        <div class="header-left">
            <button class="btn-small" onclick="window.location.href='index.html'">→ الرئيسية</button>
        </div>
    </div>

    <!-- خطوات الحاوية -->
    <div class="order-container">
        <div class="order-card">

            <div class="container-steps">
                <div class="container-step done">
                    <div class="container-step-num">1</div>
                    <div class="container-step-label">الموقع</div>
                </div>
                <div class="container-step-line"></div>
                <div class="container-step active">
                    <div class="container-step-num">2</div>
                    <div class="container-step-label">المنتج</div>
                </div>
                <div class="container-step-line"></div>
                <div class="container-step">
                    <div class="container-step-num">3</div>
                    <div class="container-step-label">الطلب</div>
                </div>
            </div>

            <div class="location-summary">
                <span id="locationSummaryText">📍 —</span>
                <a href="container-location.html" class="location-change-link">تغيير الموقع</a>
            </div>

        </div>
    </div>

    <div class="order-container" style="margin-top:0">
        <div id="providersLoading" class="empty-state">
            <div class="empty-icon">⏳</div>
            <div class="empty-title">جاري تحميل المنتجات...</div>
        </div>

        <div id="providersEmpty" class="empty-state" style="display:none">
            <div class="empty-icon">📭</div>
            <div class="empty-title">لا يوجد منتجات متاحة حالياً بهذه المدينة</div>
            <div class="empty-sub">جرّب مدينة أخرى أو تواصل معنا</div>
        </div>

        <div id="productsMapWrap" class="provider-select-list" style="display:none">
            <div id="productsMap" class="location-map"></div>
        </div>

        <div id="providersList" class="provider-select-list"></div>
    </div>

    <!-- فوتر -->
    <div class="footer">
        <div class="footer-links">
            <a href="index.html">الرئيسية</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل معنا</a>
            <a href="terms.html">الشروط والأحكام</a>
            <a href="register-provider.html">انضم كمزود</a>
        </div>
        <div class="footer-copy">
            جميع الحقوق محفوظة © 2026 <span>يشجب</span> — منصة خدمات البناء في السعودية
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="container-providers.js"></script>
</body>
</html>
