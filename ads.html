<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غَوْث - إعلانات</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-right">
            <img src="images/logo.png" alt="غَوْث" class="logo-img">
            <div class="tagline">إعلانات</div>
        </div>
        <div class="header-left">
            <button class="btn-small" onclick="window.location.href='index.html'">→ الرئيسية</button>
        </div>
    </div>

    <!-- عنوان القسم -->
    <div class="order-container">
        <div class="order-card">
            <div class="order-service-header">
                <div class="order-icon"><svg class="icon"><use href="icons.svg#icon-tow-truck" id="categoryIconUse"></use></svg></div>
                <div>
                    <h2 id="categoryTitle">إعلانات</h2>
                    <span class="service-type" id="categoryCount">0 إعلان</span>
                </div>
            </div>
        </div>
    </div>

    <!-- محرك البحث -->
    <div class="ad-search-wrap">
        <div class="ad-search-bar">
            <svg class="icon ad-search-icon"><use href="icons.svg#icon-search"></use></svg>
            <input type="text" id="searchKeyword" placeholder="ابحث عن خدمة..." oninput="searchAds()">
            <button class="ad-filter-btn" id="filterBtn" onclick="toggleFilterPanel(event)">
                <svg class="icon"><use href="icons.svg#icon-filter"></use></svg>
                <span class="ad-filter-dot" id="filterDot"></span>
            </button>

            <div class="ad-filter-panel" id="filterPanel">
                <div class="order-field">
                    <label><svg class="icon"><use href="icons.svg#icon-city"></use></svg> المدينة</label>
                    <select id="searchCity">
                        <option value="">كل المدن</option>
                    </select>
                </div>

                <div class="order-field">
                    <label><svg class="icon"><use href="icons.svg#icon-pin"></use></svg> الحي</label>
                    <input type="text" id="searchDistrict" placeholder="مثال: حي النرجس"/>
                </div>

                <div class="order-field">
                    <label><svg class="icon"><use href="icons.svg#icon-cash"></use></svg> السعر من</label>
                    <input type="number" id="searchPriceFrom" placeholder="مثال: 100"/>
                </div>

                <div class="order-field">
                    <label><svg class="icon"><use href="icons.svg#icon-cash"></use></svg> السعر إلى</label>
                    <input type="number" id="searchPriceTo" placeholder="مثال: 500"/>
                </div>

                <div class="ad-filter-panel-actions">
                    <button class="btn" onclick="applyFilterPanel()">تطبيق الفلتر</button>
                    <button class="ad-filter-clear-btn" onclick="clearFilterPanel()">مسح الفلتر</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نتائج الإعلانات -->
    <div class="services-new">
        <div class="testimonials-grid" id="adsResultsGrid" style="grid-template-columns:repeat(3,1fr)"></div>
    </div>

    <!-- فوتر -->
    <div class="footer">
        <div class="footer-links">
            <a href="index.html">الرئيسية</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل معنا</a>
            <a href="terms.html">الشروط والأحكام</a>
        </div>
        <div class="footer-copy">
            جميع الحقوق محفوظة © 2026 <span>غَوْث</span> — عـتـاد الـبـنـاء
        </div>
    </div>

    <script src="alert.js"></script>
    <script src="ads.js"></script>
</body>
</html>
