<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عتاد - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body>

    <!-- صفحة تسجيل الدخول الكاملة -->
    <div class="login-page">

        <!-- الجانب الأيمن — معلومات -->
        <div class="login-left">
            <div class="login-left-content">
                <img src="images/logo.jpg" alt="عتاد" class="login-logo">
                <h2>منصة عتاد</h2>
                <p>تصفح الإعلانات أو انشر إعلانك وتواصل مباشرة مع العملاء</p>
            </div>
        </div>

        <!-- الجانب الأيسر — نموذج الدخول -->
        <div class="login-right">
            <div class="login-form-wrap">

                <!-- رجوع + الوضع الداكن -->
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px">
                    <button class="login-back" onclick="window.location.href='index.html'" style="margin-bottom:0">
                        → رجوع للرئيسية
                    </button>
                    <button class="theme-btn login-theme-btn" onclick="toggleTheme()" id="themeBtn"><svg class="icon"><use href="icons.svg#icon-moon"></use></svg></button>
                </div>

                <h1 class="login-title">أهلاً بك <svg class="icon"><use href="icons.svg#icon-wave"></use></svg></h1>
                <p class="login-desc">أدخل رقم جوالك للمتابعة</p>

                <!-- حقل رقم الجوال -->
                <div class="login-field-label">رقم الجوال</div>
                <div class="input-group">
                    <span class="input-prefix">+966</span>
                    <input
                        type="number"
                        id="phone"
                        placeholder="5XXXXXXXX"
                        maxlength="9"
                    />
                </div>

                <!-- زر الإرسال -->
                <button class="btn btn-full" onclick="sendOTP()">
                    إرسال رمز التحقق <svg class="icon"><use href="icons.svg#icon-phone"></use></svg>
                </button>

                <!-- قسم OTP -->
                <div class="otp-section" id="otpSection">
                    <div class="otp-info">
                        <svg class="icon"><use href="icons.svg#icon-phone"></use></svg> تم إرسال رمز التحقق لجوالك
                    </div>
                    <div class="login-field-label">رمز التحقق</div>
                    <input
                        type="number"
                        id="otp"
                        placeholder="- - - - - -"
                        class="otp-input"
                    />
                    <button class="btn btn-full" onclick="verifyOTP()">
                        تحقق وادخل <svg class="icon"><use href="icons.svg#icon-check"></use></svg>
                    </button>
                    <button class="resend-btn" onclick="sendOTP()">
                        إعادة إرسال الرمز
                    </button>
                </div>

                <!-- الشروط -->
                <div class="login-terms">
                    بتسجيل دخولك أنت توافق على
                    <a href="terms.html">الشروط والأحكام</a>
                    و
                    <a href="privacy.html">سياسة الخصوصية</a>
                </div>

            </div>
        </div>

    </div>

    <!-- نافذة طلب الاسم (تظهر أول مرة فقط بعد التحقق من OTP) -->
    <div class="name-popup-overlay" id="namePopupOverlay" style="display:none">
        <div class="name-popup-card">
            <img src="images/logo.jpg" alt="عتاد" class="name-popup-logo">
            <h2 class="name-popup-title">أهلاً بك في عتاد <svg class="icon"><use href="icons.svg#icon-wave"></use></svg></h2>
            <p class="name-popup-desc">وش اسمك عشان نرحب فيك بشكل صحيح؟</p>
            <input type="text" id="nameInput" class="name-popup-input" placeholder="اكتب اسمك الكامل" onkeydown="if(event.key==='Enter') saveUserName()"/>
            <button class="btn btn-full" onclick="saveUserName()">متابعة</button>
        </div>
    </div>

    <script src="alert.js"></script>
    <script src="login.js"></script>
</body>
</html>
