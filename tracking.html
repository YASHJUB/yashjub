<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يشجب - تتبع الطلب</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest"></head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-right">
            <div class="logo">يشجب ⚙️</div>
            <div class="tagline">تتبع طلبك</div>
        </div>
        <div class="header-left">
            <button class="btn-small" onclick="window.location.href='index.html'">
                → الرئيسية
            </button>
        </div>
    </div>

    <!-- صفحة التتبع -->
    <div class="tracking-container">

        <div class="tracking-card">

            <!-- رقم الطلب -->
            <div class="tracking-header">
                <div class="tracking-icon" id="trackingIcon">🚚</div>
                <div>
                    <h2 id="trackingService">وايت ماء</h2>
                    <p class="order-number" id="orderNumber">#123456</p>
                </div>
            </div>

            <div class="order-divider"></div>

            <!-- مراحل الطلب -->
            <div class="steps">

                <div class="step done" id="step1">
                    <div class="step-icon">✅</div>
                    <div class="step-info">
                        <div class="step-title">تم استلام الطلب</div>
                        <div class="step-sub">تم تأكيد طلبك بنجاح</div>
                    </div>
                </div>

                <div class="step-line done" id="line1"></div>

                <div class="step active" id="step2">
                    <div class="step-icon">🔍</div>
                    <div class="step-info">
                        <div class="step-title">جاري البحث عن مزود</div>
                        <div class="step-sub">نبحث عن أقرب مزود لك</div>
                    </div>
                </div>

                <div class="step-line" id="line2"></div>

                <div class="step" id="step3">
                    <div class="step-icon">🚗</div>
                    <div class="step-info">
                        <div class="step-title">المزود في الطريق</div>
                        <div class="step-sub">في انتظار قبول المزود</div>
                    </div>
                </div>

                <div class="step-line" id="line3"></div>

                <div class="step" id="step4">
                    <div class="step-icon">🎉</div>
                    <div class="step-info">
                        <div class="step-title">تم التوصيل</div>
                        <div class="step-sub">اكتملت الخدمة بنجاح</div>
                    </div>
                </div>

            </div>

            <!-- خريطة الموقع -->
            <div id="trackingMapSection" style="display:none">
                <div class="order-divider"></div>
                <div id="trackingMap" class="location-map"></div>
            </div>

            <div class="order-divider"></div>

            <!-- تفاصيل الطلب -->
            <div class="tracking-details">
                <div class="detail-row">
                    <span class="detail-label">📍 الموقع</span>
                    <span class="detail-value" id="trackingAddress">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">⏱️ وقت الوصول</span>
                    <span class="detail-value" id="trackingTime">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">💰 المبلغ</span>
                    <span class="detail-value" id="trackingPrice">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🕐 وقت الطلب</span>
                    <span class="detail-value" id="trackingDate">—</span>
                </div>
            </div>

            <!-- التواصل مع المزود -->
            <div id="contactProviderSection" style="display:none">
                <div class="order-divider"></div>

                <div class="contact-provider-section">
                    <div class="contact-provider-title">📞 التواصل مع المزود</div>
                    <div class="contact-provider-info">
                        <span class="contact-provider-name" id="providerNameText">—</span>
                        <span class="contact-provider-rating">⭐ <span id="providerRatingText">—</span></span>
                    </div>
                    <div class="contact-provider-actions">
                        <button class="btn-call" onclick="callProvider()">📞 اتصال مباشر</button>
                        <button class="btn-chat" onclick="toggleChat()">💬 محادثة</button>
                    </div>

                    <!-- لوحة الشات -->
                    <div class="chat-panel" id="chatPanel" style="display:none">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-row">
                            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()"/>
                            <button class="btn-small" onclick="sendChatMessage()">إرسال</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="order-divider"></div>

            <!-- زر إلغاء -->
            <button class="btn btn-order" onclick="cancelOrder()">
                إلغاء الطلب ❌
            </button>

        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="tracking.js"></script>
</body>
</html>
