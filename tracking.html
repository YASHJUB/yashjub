<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غَوْث - تتبع الطلب</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest"></head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-right">
            <div class="logo">غَوْث <svg class="icon"><use href="icons.svg#icon-settings"></use></svg></div>
            <div class="tagline">تتبع طلبك</div>
        </div>
        <div class="header-left">
            <button class="btn-small" onclick="window.location.href='index.html'">
                → الرئيسية
            </button>
        </div>
    </div>

    <!-- صفحة التتبع -->
    <div class="tracking-container">

        <div class="tracking-card">

            <!-- رقم الطلب -->
            <div class="tracking-header">
                <div class="tracking-icon" id="trackingIcon"><svg class="icon"><use href="icons.svg#icon-truck"></use></svg></div>
                <div>
                    <h2 id="trackingService">وايت ماء</h2>
                    <p class="order-number" id="orderNumber">#123456</p>
                </div>
            </div>

            <div class="order-divider"></div>

            <!-- مراحل الطلب -->
            <div class="steps">

                <div class="step done" id="step1">
                    <div class="step-icon"><svg class="icon"><use href="icons.svg#icon-check"></use></svg></div>
                    <div class="step-info">
                        <div class="step-title">تم استلام الطلب</div>
                        <div class="step-sub">تم تأكيد طلبك بنجاح</div>
                    </div>
                </div>

                <div class="step-line done" id="line1"></div>

                <div class="step" id="step2">
                    <div class="step-icon"><svg class="icon"><use href="icons.svg#icon-hourglass"></use></svg></div>
                    <div class="step-info">
                        <div class="step-title">تم قبول المزود</div>
                        <div class="step-sub" id="step2Sub">بانتظار قبول المزود لطلبك</div>
                    </div>
                </div>

                <div class="step-line" id="line2"></div>

                <div class="step" id="step3">
                    <div class="step-icon"><svg class="icon"><use href="icons.svg#icon-car"></use></svg></div>
                    <div class="step-info">
                        <div class="step-title">المزود في الطريق</div>
                        <div class="step-sub" id="step3Sub">بانتظار قبول المزود</div>
                    </div>
                </div>

                <div class="step-line" id="line3"></div>

                <div class="step" id="step4">
                    <div class="step-icon"><svg class="icon"><use href="icons.svg#icon-confetti"></use></svg></div>
                    <div class="step-info">
                        <div class="step-title">تم التوصيل</div>
                        <div class="step-sub" id="step4Sub">بانتظار إنهاء الخدمة</div>
                    </div>
                </div>

            </div>

            <!-- خريطة الموقع -->
            <div id="trackingMapSection" style="display:none">
                <div class="order-divider"></div>
                <div id="trackingMap" class="location-map"></div>
            </div>

            <div class="order-divider"></div>

            <!-- تفاصيل الطلب -->
            <div class="tracking-details">
                <div class="detail-row">
                    <span class="detail-label"><svg class="icon"><use href="icons.svg#icon-pin"></use></svg> الموقع</span>
                    <span class="detail-value" id="trackingAddress">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><svg class="icon"><use href="icons.svg#icon-hourglass"></use></svg> وقت الوصول</span>
                    <span class="detail-value" id="trackingTime">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><svg class="icon"><use href="icons.svg#icon-cash"></use></svg> المبلغ</span>
                    <span class="detail-value" id="trackingPrice">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><svg class="icon"><use href="icons.svg#icon-clock"></use></svg> وقت الطلب</span>
                    <span class="detail-value" id="trackingDate">—</span>
                </div>
            </div>

            <!-- التواصل مع المزود -->
            <div id="contactProviderSection" style="display:none">
                <div class="order-divider"></div>

                <div class="contact-provider-section">
                    <div class="contact-provider-title"><svg class="icon"><use href="icons.svg#icon-phone-call"></use></svg> التواصل مع المزود</div>
                    <div class="contact-provider-info">
                        <span class="contact-provider-name" id="providerNameText">—</span>
                        <span class="contact-provider-rating"><svg class="icon"><use href="icons.svg#icon-star"></use></svg> <span id="providerRatingText">—</span></span>
                    </div>
                    <div class="contact-provider-actions">
                        <button class="btn-call" onclick="callProvider()"><svg class="icon"><use href="icons.svg#icon-phone-call"></use></svg> اتصال مباشر</button>
                        <button class="btn-chat" onclick="toggleChat()"><svg class="icon"><use href="icons.svg#icon-chat"></use></svg> محادثة</button>
                    </div>

                    <!-- لوحة الشات -->
                    <div class="chat-panel" id="chatPanel" style="display:none">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input-row">
                            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendChatMessage()"/>
                            <button class="btn-small" onclick="sendChatMessage()">إرسال</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تقييم الخدمة (تظهر بعد اكتمال الطلب) -->
            <div id="ratingSection" style="display:none">
                <div class="order-divider"></div>
                <div id="ratingSlot">
                    <button class="btn" style="width:100%" onclick="openTrackingRatingForm()">تقييم الخدمة ⭐</button>
                </div>
            </div>

            <!-- تحميل الفاتورة (تظهر بعد اكتمال الطلب) -->
            <div id="invoiceSection" style="display:none">
                <div class="order-divider"></div>
                <button class="btn" style="width:100%" onclick="goToInvoice()">تحميل الفاتورة 🧾</button>
            </div>

        </div>

    </div>

    <!-- نافذة تقييم الخدمة -->
    <div class="confirm-overlay" id="ratingFormOverlay" style="display:none">
        <div class="complaint-form-modal">
            <h3><svg class="icon"><use href="icons.svg#icon-star"></use></svg> تقييم الخدمة</h3>
            <div id="ratingStars" style="display:flex;justify-content:center;gap:8px;margin-bottom:18px">
                <svg class="icon rating-star" data-star="1" style="width:32px;height:32px;color:#F5C518;opacity:0.3;cursor:pointer" onclick="setStarRating(1)"><use href="icons.svg#icon-star"></use></svg>
                <svg class="icon rating-star" data-star="2" style="width:32px;height:32px;color:#F5C518;opacity:0.3;cursor:pointer" onclick="setStarRating(2)"><use href="icons.svg#icon-star"></use></svg>
                <svg class="icon rating-star" data-star="3" style="width:32px;height:32px;color:#F5C518;opacity:0.3;cursor:pointer" onclick="setStarRating(3)"><use href="icons.svg#icon-star"></use></svg>
                <svg class="icon rating-star" data-star="4" style="width:32px;height:32px;color:#F5C518;opacity:0.3;cursor:pointer" onclick="setStarRating(4)"><use href="icons.svg#icon-star"></use></svg>
                <svg class="icon rating-star" data-star="5" style="width:32px;height:32px;color:#F5C518;opacity:0.3;cursor:pointer" onclick="setStarRating(5)"><use href="icons.svg#icon-star"></use></svg>
            </div>
            <label>تعليقك (اختياري)</label>
            <textarea id="ratingComment" placeholder="شاركنا رأيك بالخدمة..."></textarea>
            <div class="complaint-form-actions">
                <button class="btn" style="flex:1" onclick="submitTrackingRating()">إرسال التقييم</button>
                <button class="btn-small" onclick="closeTrackingRatingForm()">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="alert.js"></script>
    <script src="tracking.js"></script>
</body>
</html>
