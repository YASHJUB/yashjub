<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عتاد - الرسائل</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="header-right">
            <img src="images/logo.jpg" alt="عتاد" class="logo-img">
            <div class="tagline">الرسائل</div>
        </div>
        <div class="header-left">
            <div id="notifBellWrap" style="position:relative">
                <button class="theme-btn" onclick="toggleNotifDropdown()" id="notifBellBtn" style="position:relative">
                    <svg class="icon"><use href="icons.svg#icon-bell"></use></svg>
                    <span class="notif-bell-badge" id="notifBellBadge" style="display:none">0</span>
                </button>
                <div class="notif-dropdown" id="notifDropdown" style="display:none">
                    <div class="notif-dropdown-header">الإشعارات</div>
                    <div class="notif-dropdown-list" id="notifDropdownList"></div>
                    <a href="profile.html#notifications" class="notif-dropdown-viewall">عرض الكل</a>
                </div>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn"><svg class="icon"><use href="icons.svg#icon-moon"></use></svg></button>
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        </div>
    </div>

    <!-- السايد بار -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="app-sidebar" id="appSidebar">
        <div class="sidebar-header">
            <div class="sidebar-user-icon" id="sidebarUserIcon"><svg class="icon"><use href="icons.svg#icon-user"></use></svg></div>
            <div>
                <div class="sidebar-user-name" id="sidebarUserName">مرحباً بك</div>
                <div class="sidebar-user-phone" id="sidebarPhone">سجّل دخولك</div>
            </div>
            <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="sidebar-menu">
            <a class="sidebar-link" href="index.html"><span><svg class="icon"><use href="icons.svg#icon-home"></use></svg></span> الرئيسية</a>
            <a class="sidebar-link" href="provider.html#adsSection"><span><svg class="icon"><use href="icons.svg#icon-plus"></use></svg></span> انشر إعلانك</a>
            <a class="sidebar-link" href="profile.html"><span><svg class="icon"><use href="icons.svg#icon-user"></use></svg></span> حسابي</a>
            <a class="sidebar-link" href="provider.html#adsSection"><span><svg class="icon"><use href="icons.svg#icon-broadcast"></use></svg></span> إعلاناتي</a>
            <a class="sidebar-link" href="favorites.html"><span><svg class="icon"><use href="icons.svg#icon-heart"></use></svg></span> قائمة المفضلة</a>
            <a class="sidebar-link" href="wallet.html"><span><svg class="icon"><use href="icons.svg#icon-card"></use></svg></span> محفظتي</a>
            <a class="sidebar-link" href="fees.html"><span><svg class="icon"><use href="icons.svg#icon-calculator"></use></svg></span> حاسبة الرسوم والدفع</a>
            <a class="sidebar-link active" href="messages.html"><span><svg class="icon"><use href="icons.svg#icon-chat"></use></svg></span> الرسائل <span class="sidebar-badge" id="messagesBadge" style="display:none">0</span></a>
            <div class="sidebar-divider"></div>
            <a class="sidebar-link" href="about.html"><span><svg class="icon"><use href="icons.svg#icon-info"></use></svg></span> من نحن</a>
            <a class="sidebar-link" href="contact.html"><span><svg class="icon"><use href="icons.svg#icon-phone-call"></use></svg></span> تواصل معنا</a>
            <a class="sidebar-link" href="terms.html"><span><svg class="icon"><use href="icons.svg#icon-document"></use></svg></span> الشروط والأحكام</a>
        </div>
        <div class="sidebar-footer">
            <button class="btn-small btn-logout" onclick="logout()">تسجيل الخروج <svg class="icon"><use href="icons.svg#icon-door"></use></svg></button>
        </div>
    </div>

    <!-- صفحة الرسائل -->
    <div class="messages-page" id="messagesPage">

        <!-- قائمة المحادثات -->
        <div class="messages-list-col">
            <div class="messages-search">
                <input type="text" id="convSearchInput" placeholder="بحث في المحادثات..." oninput="filterConversations()">
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="messages-empty-list">جاري التحميل...</div>
            </div>
        </div>

        <!-- المحادثة -->
        <div class="messages-chat-col">
            <div class="chat-empty-state" id="chatEmptyState">
                <svg class="icon" style="width:40px;height:40px;opacity:0.3"><use href="icons.svg#icon-chat"></use></svg>
                <div style="margin-top:10px">اختر محادثة لعرضها</div>
            </div>
            <div id="chatActiveArea" style="display:none">
                <div class="chat-header-bar">
                    <button class="chat-back-btn" onclick="closeMobileChat()">→</button>
                    <div class="conversation-avatar"><svg class="icon"><use href="icons.svg#icon-user"></use></svg></div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatHeaderName">—</div>
                        <div class="chat-header-ad" id="chatHeaderAd">—</div>
                    </div>
                    <a href="#" id="chatGotoAdBtn" class="chat-header-goto">الإعلان ←</a>
                </div>
                <div class="chat-messages-area" id="chatMessagesArea"></div>
                <div class="messages-input-row">
                    <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="messages-send-btn" onclick="sendMessage()"><svg class="icon"><use href="icons.svg#icon-arrow-left"></use></svg></button>
                </div>
            </div>
        </div>

    </div>

    <script src="alert.js"></script>
    <script src="messages.js"></script>
</body>
</html>
